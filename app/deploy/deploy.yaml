apiVersion: v1
kind: Namespace
metadata:
  name: hivemind-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-deployment
  namespace: hivemind-production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
    spec:
      # Address two different failure points with spread here
      topologySpreadConstraints:
        # Survive losing a whole AZ: keep pods evenly spread across zones (enforced)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hivemind
          matchLabelKeys: [pod-template-hash]   # judge each rollout's pods on their own
        # Survive losing a single node: avoid stacking pods on one node (best effort)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hivemind
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: hivemind
          image: 435957166704.dkr.ecr.eu-central-1.amazonaws.com/hivemind:79b892c
          env:
            - name: HELLO_TAG
              value: 79b892c
          ports:
            - name: http-app
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http-app
          livenessProbe:
            httpGet: {path: /, port: http-app}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hivemind-service
  namespace: hivemind-production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hivemind
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-ingress
  namespace: hivemind-production
  annotations:
    alb.ingress.kubernetes.io/group.name: shared
    alb.ingress.kubernetes.io/load-balancer-name: shared-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:435957166704:certificate/842931b2-ccb6-4331-a1c6-d98b44f98028
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: hivemind.subcloudlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hivemind-service
                port:
                  number: 80
---
apiVersion: policy/v1
# Limits the number of replicated application pods that can be simultaneously down during a voluntary disruption
kind: PodDisruptionBudget
metadata:
  name: hivemind
  namespace: hivemind-production
spec:
  # Drains evict one pod at a time. Used during a voluntary node upgrade.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hivemind
  namespace: hivemind-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hivemind-deployment
  minReplicas: 6
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hivemind
  namespace: hivemind-production
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: hivemind-secrets }
  data:
    - secretKey: API_KEY
      remoteRef: { key: hivemind/production/api-key }