apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-podinfo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # after Kargo (wave 0) — needs its CRDs
spec:
  project: platform
  destination: { server: https://kubernetes.default.svc }
  source:
    repoURL: https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
    targetRevision: HEAD
    path: platform/gitops/kargo/podinfo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5 }     # Warehouse may race the Project's namespace on first sync
