apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"     # after cert-manager (-1): needs its CRDs for webhook certs
spec:
  project: platform
  destination: { server: https://kubernetes.default.svc, namespace: kargo }
  sources:
    - repoURL: ghcr.io/akuity/kargo-charts
      chart: kargo
      targetRevision: 1.12.5
      helm:
        valueFiles: [$values/platform/gitops/values/kargo.yaml]
    - repoURL: https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]