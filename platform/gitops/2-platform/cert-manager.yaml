apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles: [$values/platform/gitops/values/cert-manager.yaml]
    - repoURL: https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
