apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crate
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: workloads           # ← the restricted project goes here
  destination: { server: https://kubernetes.default.svc, namespace: crate }
  source:
    repoURL: https://github.com/williamdunstanmorris/CrateCLI
    targetRevision: HEAD
    path: deploy
    directory:
      exclude: "local/*"
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]