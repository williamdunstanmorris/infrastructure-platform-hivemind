apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        valueFiles: [$values/platform/gitops/values/external-dns.yaml]
    - repoURL: https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
