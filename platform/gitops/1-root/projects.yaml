apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos: ["*"]
  destinations: [{ server: https://kubernetes.default.svc, namespace: "*" }]
  clusterResourceWhitelist: [{ group: "*", kind: "*" }]   # CRDs, webhooks, ClusterRoles
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
    - https://github.com/williamdunstanmorris/CrateCLI
    - https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
  destinations:
    - { server: https://kubernetes.default.svc, namespace: crate }
    - { server: https://kubernetes.default.svc, namespace: "podinfo-*" }
  clusterResourceWhitelist: [{ group: "", kind: Namespace }]