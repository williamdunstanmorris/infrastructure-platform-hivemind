apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: hivemind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/williamdunstanmorris/infrastructure-platform-hivemind
    targetRevision: HEAD
    path: app/deploy
  destination: 
    server: https://kubernetes.default.svc 
    namespace: hivemind
  syncPolicy:
    automated: 
      prune: true 
      selfHeal: true
      syncOptions: CreateNamespace=true