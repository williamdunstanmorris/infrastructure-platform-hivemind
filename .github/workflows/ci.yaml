name: ci-cd
on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
  pull_request:

permissions:
  id-token: write   # OIDC to AWS
  contents: write   # commit the tag bump

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && go test ./...
      - run: docker build -t app:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # everything below runs on main only; PRs stop after the scan
      - if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - if: github.ref == 'refs/heads/main'
        run: |
          TAG=${GITHUB_SHA::7}
          IMG=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          docker tag app:${{ github.sha }} $IMG:$TAG
          docker push $IMG:$TAG
          echo "TAG=$TAG" >> $GITHUB_ENV
      - if: github.ref == 'refs/heads/main'
        run: |
          yq -i '.image.tag = strenv(TAG) | .helloTag = strenv(TAG)' deploy/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: $TAG"
          git push