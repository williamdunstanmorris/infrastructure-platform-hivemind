name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
#      - "app/deploy/**"
      - "**.md"

permissions:
  id-token: write # MANDATORY for AWS OIDC role-to-assume
  contents: write # Needed to commit gitops updates back

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Go & Run Tests
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/src/go.mod

      - name: Run Tests
        working-directory: app/src
        run: go test ./...

      - name: Set Image Tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

#      - name: Configure AWS Credentials
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # Using repository variable
#          aws-region: eu-central-1
#
#      - name: Log in to ECR
#        uses: aws-actions/amazon-ecr-login@v2
#
#      - name: Build and Push Docker Image
#        working-directory: app/src
#        run: |
#          REGISTRY="435957166704.dkr.ecr.eu-central-1.amazonaws.com/hivemind"
#          docker build --platform linux/amd64 -t $REGISTRY:${{ env.TAG }} .
#          docker push $REGISTRY:${{ env.TAG }}

      # Update image tag in app/deploy/deploy.yaml
      - name: Update deployment image tag
        run: |
          MANIFEST="app/deploy/deploy.yaml"
          IMAGE_URI="435957166704.dkr.ecr.eu-central-1.amazonaws.com/hivemind:${{ env.TAG }}"
          
#          yq -i '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = "'"$IMAGE_URI"'"' $MANIFEST
          yq -i '(select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "HELLO_TAG").value) = "'"${{ env.TAG }}"'"' $MANIFEST
      
      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/deploy/deploy.yaml
          git diff-index --quiet HEAD || (git commit -m "deploy(gitops): update image tag to ${{ env.TAG }}" && git push)