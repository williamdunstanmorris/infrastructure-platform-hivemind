name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "apps/deploy/**"
      - "**.md"

permissions:
  id-token: write # MANDATORY for AWS OIDC role-to-assume
  contents: write # Needed to commit gitops updates back

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Go & Run Tests
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/src/go.mod

      - name: Run Tests
        working-directory: app/src
        run: go test ./...

      # 2. Generate short SHA tag
      - name: Set Image Tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 3. AWS OIDC Auth & ECR Login
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # Using repository variable
          aws-region: eu-central-1

#      - name: Log in to ECR
#        uses: aws-actions/amazon-ecr-login@v2
#
#      # 4. Build Docker image with cross-compilation target
#      - name: Build and Push Docker Image
#        working-directory: app/src
#        run: |
#          REGISTRY="435957166704.dkr.ecr.eu-central-1.amazonaws.com/hivemind"
#          docker build --platform linux/amd64 -t $REGISTRY:${{ env.TAG }} .
#          docker push $REGISTRY:${{ env.TAG }}

      - name: Update deployment manifest
        run: |
          MANIFEST="apps/deploy/deploy.yaml"
          IMAGE_URI="435957166704.dkr.ecr.eu-central-1.amazonaws.com/hivemind:${{ env.TAG }}"
          
          # Set image
          yq -i ".spec.template.spec.containers[0].image = \"$IMAGE_URI\"" $MANIFEST
          
          # Safely ensure env array exists and set APP_VERSION
          yq -i '
            .spec.template.spec.containers[0].env //= [] |
            (.spec.template.spec.containers[0].env[] | select(.name == "APP_VERSION").value) = "'"${{ env.TAG }}"'" //
            .spec.template.spec.containers[0].env += [{"name": "APP_VERSION", "value": "'"${{ env.TAG }}"'"}]
          ' $MANIFEST

      # 6. Commit back to repo for ArgoCD sync
      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/deploy/deploy.yaml
          git diff-index --quiet HEAD || (git commit -m "deploy(gitops): update image tag to ${{ env.TAG }}" && git push)